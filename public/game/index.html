<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON TANKS</title>
<style>
:root{--neon-cyan:#00f0ff;--neon-magenta:#ff00d4;--neon-yellow:#ffe600;--neon-red:#ff2a4d;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;}
body{display:flex;justify-content:center;align-items:center;font-family:sans-serif;background:radial-gradient(ellipse at center,#0d1a0d 0%,#050d05 70%,#000 100%);}
#game-wrap{position:relative;width:min(100vh*9/16,100vw);height:min(100vh,100vw*16/9);aspect-ratio:9/16;max-width:720px;max-height:1280px;background:#050d05;border:2px solid var(--neon-cyan);border-radius:4px;box-shadow:0 0 30px rgba(0,240,255,0.3);overflow:hidden;}
#game{width:100%;height:100%;display:block;background:#0a140a;}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="720" height="1280"></canvas>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=720,H=1280;
const C={cyan:'#00f0ff',magenta:'#ff00d4',yellow:'#ffe600',red:'#ff2a4d',green:'#00ff9c',white:'#e0f7ff'};

const assets={};
let imgsLoaded=0;
function loadImg(key,src){
  const img=new Image();
  img.onload=()=>{imgsLoaded++;};
  img.onerror=()=>{imgsLoaded++;};
  img.src=src;
  assets[key]=img;
}
loadImg('player','assets/sprites/player.png');
loadImg('enemy','assets/sprites/enemy.png');
loadImg('boss1','assets/sprites/boss_1.png');
loadImg('boss2','assets/sprites/boss_2.png');
loadImg('boss3','assets/sprites/boss_3.png');

const bgm=new Audio('assets/audio/bgm.mp3');
bgm.loop=true;
bgm.volume=0.5;
let bgmStarted=false;
function startBGM(){
  if(!bgmStarted){
    bgm.play().then(()=>{bgmStarted=true;}).catch(()=>{
      const unlock=()=>{bgm.play().then(()=>{bgmStarted=true;}).catch(()=>{});document.removeEventListener('keydown',unlock);document.removeEventListener('click',unlock);};
      document.addEventListener('keydown',unlock);
      document.addEventListener('click',unlock);
    });
  }
}
function stopBGM(){bgm.pause();bgm.currentTime=0;bgmStarted=false;}
function pauseBGM(){bgm.pause();}
function resumeBGM(){if(bgmStarted)bgm.play().catch(()=>{});}

let state='loading',score=0,gameTime=0,lastTime=0;
let level=1,kills=0,bossSpawned=false;
const keys={};

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(state==='menu'&&(e.key==='Enter'||e.key===' '))startGame();
  if(state==='levelclear'&&(e.key==='Enter'||e.key===' '))nextLevel();
  if(state==='gameover'&&(e.key==='Enter'||e.key===' '))startGame();
  if(state==='victory'&&(e.key==='Enter'||e.key===' '))startGame();
  if(state==='playing'&&e.key.toLowerCase()==='p'){state='paused';pauseBGM();}
  else if(state==='paused'&&e.key.toLowerCase()==='p'){state='playing';resumeBGM();}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// Touch controls (mobile)
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0};
let fireTouchId=null,touchFiring=false;
function toCanvas(t){const r=canvas.getBoundingClientRect();return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=toCanvas(t);
    if(state==='menu'||state==='gameover'||state==='victory'){startGame();return;}
    if(state==='levelclear'){nextLevel();return;}
    if(p.x>W-70&&p.y<70){
      if(state==='playing'){state='paused';pauseBGM();}
      else if(state==='paused'){state='playing';resumeBGM();}
      continue;
    }
    if(state!=='playing')continue;
    if(p.x<W/2&&!joy.active){joy.active=true;joy.id=t.identifier;joy.ox=p.x;joy.oy=p.y;joy.dx=0;joy.dy=0;}
    else if(p.x>=W/2&&fireTouchId===null){fireTouchId=t.identifier;touchFiring=true;}
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(joy.active&&t.identifier===joy.id){
      const p=toCanvas(t);
      let dx=p.x-joy.ox,dy=p.y-joy.oy;
      const d=Math.sqrt(dx*dx+dy*dy),max=60;
      if(d>max){dx=dx/d*max;dy=dy/d*max;}
      joy.dx=dx/max;joy.dy=dy/max;
    }
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(joy.active&&t.identifier===joy.id){joy.active=false;joy.id=null;joy.dx=0;joy.dy=0;}
    if(t.identifier===fireTouchId){fireTouchId=null;touchFiring=false;}
  }
}
canvas.addEventListener('touchend',endTouch,{passive:false});
canvas.addEventListener('touchcancel',endTouch,{passive:false});

const player={x:W/2,y:H-120,w:52,h:52,speed:3.5,angle:-Math.PI/2,hp:4,maxHp:4,fireCooldown:0,invincible:0,power:1};
let bullets=[],enemies=[],enemyBullets=[],particles=[],items=[],walls=[];
let stars=[];
for(let i=0;i<80;i++){stars.push({x:Math.random()*W,y:Math.random()*H,speed:0.3+Math.random()*1.5,size:Math.random()*2+0.5});}

const levels=[
  {name:'LEVEL 1',enemyHp:2,enemySpeed:1.8,enemyCount:8,bossHp:50,bossType:'boss1',walls:10},
  {name:'LEVEL 2',enemyHp:4,enemySpeed:2.2,enemyCount:10,bossHp:75,bossType:'boss2',walls:14},
  {name:'LEVEL 3',enemyHp:6,enemySpeed:2.6,enemyCount:12,bossHp:100,bossType:'boss3',walls:18}
];

function buildWalls(){
  walls=[];
  const lv=levels[level-1];
  for(let i=0;i<lv.walls;i++){
    const bw=60,bh=30;
    const x=60+Math.random()*(W-120-bw);
    const y=200+Math.random()*(H-500);
    let ok=true;
    for(const w of walls){if(Math.abs(w.x+w.w/2-(x+bw/2))<bw+20&&Math.abs(w.y+w.h/2-(y+bh/2))<bh+20){ok=false;break;}}
    if(Math.abs(x+bw/2-player.x)<100&&Math.abs(y+bh/2-player.y)<100)ok=false;
    if(ok)walls.push({x,y,w:bw,h:bh,hp:3,maxHp:3});
  }
}

function spawnEnemy(){
  const lv=levels[level-1];
  const side=Math.floor(Math.random()*3);
  let x,y;
  if(side===0){x=60+Math.random()*(W-120);y=60;}
  else if(side===1){x=60;y=80+Math.random()*(H*0.4);}
  else{x=W-60;y=80+Math.random()*(H*0.4);}
  enemies.push({x,y,w:48,h:48,angle:Math.PI/2,hp:lv.enemyHp,maxHp:lv.enemyHp,speed:lv.enemySpeed,score:200,color:C.magenta,fireCooldown:1+Math.random()*2,moveTimer:0});
}

function spawnBoss(){
  const lv=levels[level-1];
  enemies.push({type:'boss',bossType:lv.bossType,x:W/2,y:120,w:130,h:130,angle:Math.PI/2,hp:lv.bossHp,maxHp:lv.bossHp,speed:0.8,score:5000,color:C.red,fireCooldown:1,pattern:0,patternTimer:0});
}

function fireBullet(){
  const p=player.power;
  const a=player.angle;
  const nx=Math.cos(a),ny=Math.sin(a);
  bullets.push({x:player.x+nx*30,y:player.y+ny*30,vx:nx*9,vy:ny*9,dmg:1,w:10,h:10,color:C.cyan});
  if(p>=2){
    const pa1=a-0.15,pa2=a+0.15;
    bullets.push({x:player.x+Math.cos(pa1)*30,y:player.y+Math.sin(pa1)*30,vx:Math.cos(pa1)*9,vy:Math.sin(pa1)*9,dmg:1,w:8,h:8,color:C.cyan});
    bullets.push({x:player.x+Math.cos(pa2)*30,y:player.y+Math.sin(pa2)*30,vx:Math.cos(pa2)*9,vy:Math.sin(pa2)*9,dmg:1,w:8,h:8,color:C.cyan});
  }
  if(p>=3){
    const pa1=a-0.35,pa2=a+0.35;
    bullets.push({x:player.x+Math.cos(pa1)*30,y:player.y+Math.sin(pa1)*30,vx:Math.cos(pa1)*9,vy:Math.sin(pa1)*9,dmg:1,w:8,h:8,color:C.magenta});
    bullets.push({x:player.x+Math.cos(pa2)*30,y:player.y+Math.sin(pa2)*30,vx:Math.cos(pa2)*9,vy:Math.sin(pa2)*9,dmg:1,w:8,h:8,color:C.magenta});
  }
}

function enemyFire(e,targetAngle){
  enemyBullets.push({x:e.x+Math.cos(targetAngle)*30,y:e.y+Math.sin(targetAngle)*30,vx:Math.cos(targetAngle)*5,vy:Math.sin(targetAngle)*5,w:8,h:8,color:e.color});
}

function bossFire(b){
  b.patternTimer++;
  if(b.patternTimer>90){b.patternTimer=0;b.pattern=(b.pattern+1)%3;}
  if(b.pattern===0){
    for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2+gameTime;enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,w:10,h:10,color:C.red});}
  }else if(b.pattern===1){
    for(let i=-2;i<=2;i++){const a=b.angle+i*0.25;enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,w:9,h:9,color:C.yellow});}
  }else{
    const dx=player.x-b.x,dy=player.y-b.y;
    const a=Math.atan2(dy,dx);
    for(let i=-1;i<=1;i++){const aa=a+i*0.3;enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*4.5,vy:Math.sin(aa)*4.5,w:9,h:9,color:C.magenta});}
  }
}

function addParticle(x,y,color,count){for(let i=0;i<count;i++){particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color,size:2+Math.random()*3});}}

function rectHit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;}

function hitWall(x,y,r){
  for(const w of walls){if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return w;}
  return null;
}

function startGame(){
  if(state==='loading')return;
  state='playing';score=0;gameTime=0;level=1;
  player.x=W/2;player.y=H-120;player.hp=player.maxHp;player.invincible=0;player.power=1;player.angle=-Math.PI/2;
  bullets=[];enemies=[];enemyBullets=[];particles=[];items=[];
  kills=0;bossSpawned=false;
  buildWalls();
  startBGM();
}

function nextLevel(){
  level++;
  if(level>3){state='victory';return;}
  state='playing';
  player.hp=Math.min(player.maxHp,player.hp+1);
  bullets=[];enemies=[];enemyBullets=[];particles=[];items=[];
  kills=0;bossSpawned=false;
  buildWalls();
}

function update(dt){
  gameTime+=dt;
  for(const s of stars){s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  if(state!=='playing')return;
  const lv=levels[level-1];

  if(!bossSpawned&&enemies.length===0){
    if(kills>=lv.enemyCount){bossSpawned=true;spawnBoss();}
    else if(enemies.length<3){spawnEnemy();}
  }

  let mx=0,my=0;
  if(keys['arrowleft']||keys['a'])mx-=1;
  if(keys['arrowright']||keys['d'])mx+=1;
  if(keys['arrowup']||keys['w'])my-=1;
  if(keys['arrowdown']||keys['s'])my+=1;
  if(joy.active&&(joy.dx!==0||joy.dy!==0)){mx=joy.dx;my=joy.dy;}
  if(mx!==0||my!==0){
    const target=Math.atan2(my,mx);
    let diff=target-player.angle;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    player.angle+=diff*0.25;
    let nx=player.x+mx*player.speed,ny=player.y+my*player.speed;
    nx=Math.max(30,Math.min(W-30,nx));ny=Math.max(30,Math.min(H-30,ny));
    if(!hitWall(nx,ny,24)){player.x=nx;player.y=ny;}
    else if(!hitWall(player.x,ny,24)){player.y=ny;}
    else if(!hitWall(nx,player.y,24)){player.x=nx;}
  }
  player.fireCooldown-=dt;
  if((keys[' ']||keys['z']||touchFiring)&&player.fireCooldown<=0){fireBullet();player.fireCooldown=0.35;}
  if(player.invincible>0)player.invincible-=dt;

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue;}
    const wall=hitWall(b.x,b.y,4);
    if(wall){wall.hp--;addParticle(b.x,b.y,C.yellow,5);bullets.splice(i,1);if(wall.hp<=0){walls.splice(walls.indexOf(wall),1);addParticle(wall.x+wall.w/2,wall.y+wall.h/2,C.yellow,12);}continue;}
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(rectHit(b,e)){
        e.hp-=b.dmg;addParticle(b.x,b.y,C.cyan,4);hit=true;
        if(e.hp<=0){
          score+=e.score;addParticle(e.x,e.y,e.color,18);addParticle(e.x,e.y,C.white,8);
          if(e.type==='boss'){
            if(level>=3){state='victory';stopBGM();}
            else{state='levelclear';}
          }else{kills++;if(Math.random()<0.25){items.push({x:e.x,y:e.y,type:Math.random()<0.5?'power':'hp'});}}
          enemies.splice(j,1);
        }
        break;
      }
    }
    if(hit)bullets.splice(i,1);
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x,dy=player.y-e.y;
    const targetAngle=Math.atan2(dy,dx);
    let diff=targetAngle-e.angle;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    e.angle+=diff*0.06;
    if(e.type==='boss'){
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>250){
        const nx=e.x+Math.cos(e.angle)*e.speed,ny=e.y+Math.sin(e.angle)*e.speed;
        if(nx>70&&nx<W-70&&ny>70&&ny<H-70&&!hitWall(nx,ny,60)){e.x=nx;e.y=ny;}
      }
      e.fireCooldown-=dt;
      if(e.fireCooldown<=0){bossFire(e);e.fireCooldown=0.7;}
    }else{
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>180){
        const nx=e.x+Math.cos(e.angle)*e.speed,ny=e.y+Math.sin(e.angle)*e.speed;
        if(nx>40&&nx<W-40&&ny>40&&ny<H-40&&!hitWall(nx,ny,26)){e.x=nx;e.y=ny;}
        else{e.angle+=1.5;}
      }
      e.fireCooldown-=dt;
      if(e.fireCooldown<=0&&dist<520){enemyFire(e,targetAngle);e.fireCooldown=1.5+Math.random()*1.5;}
      if(player.invincible<=0&&rectHit(player,e)){
        player.hp--;player.invincible=2;addParticle(e.x,e.y,e.color,15);
        e.hp-=2;if(e.hp<=0){enemies.splice(i,1);kills++;}
        if(player.hp<=0){state='gameover';stopBGM();}
      }
    }
  }

  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){enemyBullets.splice(i,1);continue;}
    const wall=hitWall(b.x,b.y,4);
    if(wall){wall.hp--;enemyBullets.splice(i,1);if(wall.hp<=0){walls.splice(walls.indexOf(wall),1);addParticle(wall.x+wall.w/2,wall.y+wall.h/2,C.yellow,12);}continue;}
    if(player.invincible<=0){
      const pb={x:player.x,y:player.y,w:30,h:30};
      if(rectHit(pb,b)){player.hp--;player.invincible=2;addParticle(player.x,player.y,C.red,20);enemyBullets.splice(i,1);if(player.hp<=0){state='gameover';stopBGM();}}
    }
  }

  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(Math.abs(it.x-player.x)<40&&Math.abs(it.y-player.y)<40){
      if(it.type==='power')player.power=Math.min(3,player.power+1);
      else player.hp=Math.min(player.maxHp,player.hp+1);
      addParticle(it.x,it.y,C.green,10);
      items.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life-=dt*2;if(p.life<=0)particles.splice(i,1);}
}

function drawTank(x,y,angle,w,h,color,isPlayer){
  const img=isPlayer?assets.player:assets.enemy;
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);ctx.shadowColor=color;ctx.shadowBlur=12;
    ctx.drawImage(img,-w/2,-h/2,w,h);ctx.shadowBlur=0;ctx.restore();
  }else{
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(-w/2,-h/2+3,10,h-6);
    ctx.fillRect(w/2-10,-h/2+3,10,h-6);
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=12;
    ctx.fillRect(-w/2+10,-h/2+7,w-20,h-14);
    ctx.shadowBlur=0;
    ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.arc(0,0,w/4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=8;
    ctx.fillRect(0,-4,w/2+12,8);
    ctx.shadowBlur=0;
    ctx.fillStyle=C.white;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawBossTank(x,y,angle,w,h,bossType){
  const typeToImg={boss1:assets.boss1,boss2:assets.boss2,boss3:assets.boss3};
  const img=typeToImg[bossType]||assets.boss1;
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);ctx.shadowColor=C.red;ctx.shadowBlur=20;
    ctx.drawImage(img,-w/2,-h/2,w,h);ctx.shadowBlur=0;ctx.restore();
  }else{
    drawTank(x,y,angle,w,h,C.red,false);
  }
}

function drawItem(it){
  ctx.save();ctx.translate(it.x,it.y);
  const color=it.type==='power'?C.magenta:C.green;
  ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(12,0);ctx.lineTo(0,12);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle=C.white;ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText(it.type==='power'?'P':'H',0,4);ctx.restore();
}

function drawHUD(){
  const lv=levels[level-1];
  ctx.save();ctx.fillStyle=C.cyan;ctx.font='bold 24px sans-serif';ctx.textAlign='left';ctx.shadowColor=C.cyan;ctx.shadowBlur=10;
  ctx.fillText('SCORE: '+score,20,40);
  ctx.textAlign='center';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText(lv.name,W/2,40);
  ctx.textAlign='right';ctx.fillStyle=C.cyan;ctx.fillText('POWER: '+player.power,W-70,40);
  if(bossSpawned&&enemies.some(e=>e.type==='boss')){
    const boss=enemies.find(e=>e.type==='boss');
    const bw=(boss.hp/boss.maxHp)*(W-100);
    ctx.fillStyle='#333';ctx.fillRect(50,70,W-100,10);
    ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=10;ctx.fillRect(50,70,bw,10);ctx.shadowBlur=0;
  }
  ctx.textAlign='left';ctx.font='bold 16px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;
  ctx.fillText('HP: ',20,105);
  for(let i=0;i<player.maxHp;i++){ctx.fillStyle=i<player.hp?C.red:'#333';ctx.shadowColor=i<player.hp?C.red:'#000';ctx.fillRect(60+i*30,93,20,12);}
  ctx.fillStyle='#888';ctx.shadowBlur=0;ctx.fillText('KILLS: '+kills+'/'+lv.enemyCount,20,130);
  ctx.restore();
}

function drawLoading(){
  ctx.save();ctx.textAlign='center';ctx.font='bold 40px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('LOADING...',W/2,H/2);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=5;ctx.fillText(imgsLoaded+'/5 ASSETS LOADED',W/2,H/2+40);ctx.restore();
}

function drawMenu(){
  ctx.save();ctx.textAlign='center';
  ctx.font='bold 60px sans-serif';ctx.fillStyle=C.green;ctx.shadowColor=C.green;ctx.shadowBlur=30;ctx.fillText('NEON',W/2,400);
  ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText('TANKS',W/2,480);
  ctx.font='24px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER OR SPACE TO START',W/2,600);
  ctx.font='18px sans-serif';ctx.fillStyle='#888';ctx.shadowBlur=0;
  ctx.fillText('WASD / ARROWS: MOVE',W/2,700);
  ctx.fillText('SPACE / Z: FIRE',W/2,730);
  ctx.fillText('P: PAUSE',W/2,760);
  if(isTouch){ctx.fillStyle=C.cyan;ctx.fillText('TOUCH LEFT: MOVE / RIGHT: FIRE',W/2,790);}
  ctx.fillStyle=C.green;ctx.fillText('3 LEVELS + 3 BOSSES',W/2,820);
  ctx.restore();
}

function drawLevelClear(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.font='bold 50px sans-serif';ctx.fillStyle=C.green;ctx.shadowColor=C.green;ctx.shadowBlur=30;ctx.fillText('LEVEL '+level+' CLEAR!',W/2,H/2-50);
  ctx.font='bold 30px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText('SCORE: '+score,W/2,H/2+20);
  ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER FOR NEXT LEVEL',W/2,H/2+100);ctx.restore();
}

function drawVictory(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.font='bold 60px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.shadowBlur=40;ctx.fillText('VICTORY!',W/2,H/2-80);
  ctx.font='bold 30px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('ALL BOSSES DEFEATED',W/2,H/2);
  ctx.font='bold 40px sans-serif';ctx.fillStyle=C.magenta;ctx.shadowColor=C.magenta;ctx.fillText('FINAL SCORE: '+score,W/2,H/2+80);
  ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=0;ctx.fillText('PRESS ENTER TO PLAY AGAIN',W/2,H/2+160);ctx.restore();
}

function drawGameOver(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.font='bold 50px sans-serif';ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=30;ctx.fillText('GAME OVER',W/2,500);
  ctx.font='bold 30px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText('SCORE: '+score,W/2,580);
  ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER TO RESTART',W/2,680);ctx.restore();
}

function drawPause(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.font='bold 40px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('PAUSED',W/2,H/2);
  ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=0;ctx.fillText('PRESS P TO RESUME',W/2,H/2+40);ctx.restore();
}

function drawTouchControls(){
  ctx.save();
  ctx.globalAlpha=0.35;ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(W-110,H-140,55,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.9;ctx.fillStyle=C.white;ctx.shadowBlur=0;ctx.font='bold 22px sans-serif';ctx.textAlign='center';
  ctx.fillText('FIRE',W-110,H-133);
  ctx.globalAlpha=0.5;ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(W-34,34,22,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#050d05';
  ctx.fillRect(W-41,26,5,16);ctx.fillRect(W-32,26,5,16);
  if(joy.active){
    ctx.globalAlpha=0.25;ctx.fillStyle=C.cyan;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(joy.ox,joy.oy,60,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.arc(joy.ox+joy.dx*60,joy.oy+joy.dy*60,28,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function render(){
  ctx.fillStyle='#0a140a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,255,156,0.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(0.3+s.speed/4)+')';ctx.fillRect(s.x,s.y,s.size,s.size);}
  if(state==='loading'){drawLoading();if(imgsLoaded>=5)state='menu';return;}
  if(state==='menu'){drawMenu();return;}
  if(state==='levelclear'){drawLevelClear();return;}
  if(state==='victory'){drawVictory();return;}

  for(const w of walls){
    ctx.save();
    const ratio=w.hp/w.maxHp;
    ctx.fillStyle=ratio>0.66?'#8B4513':ratio>0.33?'#A0522D':'#654321';
    ctx.shadowColor=C.yellow;ctx.shadowBlur=4;
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.shadowBlur=0;
    ctx.strokeStyle='#3d2817';ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h);
    ctx.restore();
  }

  for(const b of bullets){ctx.save();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(b.x,b.y,b.w/2,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(const b of enemyBullets){ctx.save();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.w/2,0,Math.PI*2);ctx.fill();ctx.restore();}

  for(const e of enemies){
    if(e.type==='boss'){
      drawBossTank(e.x,e.y,e.angle,e.w,e.h,e.bossType);
    }else{
      drawTank(e.x,e.y,e.angle,e.w,e.h,e.color,false);
      if(e.hp<e.maxHp){const bw=(e.hp/e.maxHp)*e.w;ctx.fillStyle='#333';ctx.fillRect(e.x-e.w/2,e.y-e.h/2-10,e.w,3);ctx.fillStyle=C.red;ctx.fillRect(e.x-e.w/2,e.y-e.h/2-10,bw,3);}
    }
  }
  for(const it of items)drawItem(it);
  if(player.invincible<=0||Math.floor(player.invincible*10)%2===0){drawTank(player.x,player.y,player.angle,player.w,player.h,C.cyan,true);}
  for(const p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=5;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.restore();}
  if(state==='playing'||state==='paused')drawHUD();
  if(state==='paused')drawPause();
  if(state==='gameover')drawGameOver();
  if((state==='playing'||state==='paused')&&isTouch)drawTouchControls();
}

function loop(time){
  if(!lastTime)lastTime=time;
  const dt=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
